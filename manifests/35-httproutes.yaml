# One HTTPRoute per public hostname (and per path prefix for the API). They were first generated from the old Istio routing and
# are now maintained by hand: to add a service see examples/httproute.yaml and docs/05-step-4-configure-the-edge.md.
# Attach point: Gateway prod-edge-gateway (envoy-gateway-system).
# Note: Istio 'prefix: /x' is a plain string prefix (also matches /xyz); Gateway API PathPrefix
# matches whole path segments (/x and /x/...). Verify no client depends on the looser match.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prod-argocd
  namespace: argocd
spec:
  parentRefs:
  - name: prod-edge-gateway
    namespace: envoy-gateway-system
  hostnames:
  - prod-argocd.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argo-cd-argocd-server
      port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prod-jenkins
  namespace: jenkins
spec:
  parentRefs:
  - name: prod-edge-gateway
    namespace: envoy-gateway-system
  hostnames:
  - prod-jenkins.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jenkins
      port: 8080
    timeouts:
      request: 300s
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Port
          value: '443'
        - name: X-Forwarded-Proto
          value: https

