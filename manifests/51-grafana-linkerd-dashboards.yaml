apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-linkerd-graph
  namespace: monitoring-ns
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Linkerd
data:
  linkerd-graph.json: "{\n \"uid\": \"linkerd-graph\",\n \"title\": \"Linkerd / Service graph\",\n \"description\": \"Who talks to whom, with success and latency per edge. Replaces linkerd-viz edges and top.\",\n \"tags\": [\n  \"linkerd\"\n ],\n \"timezone\": \"browser\",\n \"schemaVersion\": 39,\n \"version\": 1,\n \"editable\": true,\n \"refresh\": \"30s\",\n \"graphTooltip\": 1,\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"panels\": [\n  {\n   \"id\": 38,\n   \"type\": \"row\",\n   \"title\": \"Edges: who talks to whom (like linkerd viz edges)\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 39,\n   \"type\": \"table\",\n   \"title\": \"Caller -> callee, measured at the callee\",\n   \"description\": \"Built from the callee's inbound metrics and the caller's mTLS identity, so it also shows success and latency per edge. This is also the data that scripts/gen_callgraph.py turns into least-privilege policy.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 1,\n    \"w\": 24,\n    \"h\": 12\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"label_replace(label_replace(sum by (client_id, namespace, deployment) (rate(request_total{direction=\\\"inbound\\\",namespace=~\\\"$namespace\\\",client_id!=\\\"\\\"}[$__range])), \\\"caller\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^([^.]+)\\\\\\\\..*\\\"), \\\"caller_ns\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^[^.]+\\\\\\\\.([^.]+)\\\\\\\\..*\\\")\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"label_replace(label_replace(sum by (client_id, namespace, deployment) (rate(response_total{direction=\\\"inbound\\\",namespace=~\\\"$namespace\\\",client_id!=\\\"\\\",classification=\\\"success\\\"}[$__range])) / sum by (client_id, namespace, deployment) (rate(response_total{direction=\\\"inbound\\\",namespace=~\\\"$namespace\\\",client_id!=\\\"\\\"}[$__range])), \\\"caller\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^([^.]+)\\\\\\\\..*\\\"), \\\"caller_ns\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^[^.]+\\\\\\\\.([^.]+)\\\\\\\\..*\\\")\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"label_replace(label_replace(histogram_quantile(0.95, sum by (le, client_id, namespace, deployment) (rate(response_latency_ms_bucket{direction=\\\"inbound\\\",namespace=~\\\"$namespace\\\",client_id!=\\\"\\\"}[$__range]))), \\\"caller\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^([^.]+)\\\\\\\\..*\\\"), \\\"caller_ns\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^[^.]+\\\\\\\\.([^.]+)\\\\\\\\..*\\\")\",\n     \"refId\": \"C\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    }\n   ],\n   \"transformations\": [\n    {\n     \"id\": \"merge\"\n    },\n    {\n     \"id\": \"organize\",\n     \"options\": {\n      \"excludeByName\": {\n       \"Time\": true\n      },\n      \"renameByName\": {\n       \"Value #A\": \"RPS\",\n       \"Value #B\": \"Success\",\n       \"Value #C\": \"p95 ms\",\n       \"caller\": \"Caller\",\n       \"caller_ns\": \"Caller ns\",\n       \"deployment\": \"Callee\",\n       \"namespace\": \"Callee ns\"\n      }\n     }\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"sortBy\": [\n     {\n      \"displayName\": \"RPS\",\n      \"desc\": true\n     }\n    ]\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"RPS\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"reqps\"\n       }\n      ]\n     },\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Success\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"percentunit\"\n       },\n       {\n        \"id\": \"custom.cellOptions\",\n        \"value\": {\n         \"type\": \"color-background\"\n        }\n       },\n       {\n        \"id\": \"thresholds\",\n        \"value\": {\n         \"mode\": \"absolute\",\n         \"steps\": [\n          {\n           \"color\": \"red\",\n           \"value\": null\n          },\n          {\n           \"color\": \"orange\",\n           \"value\": 0.95\n          },\n          {\n           \"color\": \"green\",\n           \"value\": 0.99\n          }\n         ]\n        }\n       }\n      ]\n     },\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"p95 ms\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"ms\"\n       }\n      ]\n     }\n    ]\n   }\n  },\n  {\n   \"id\": 40,\n   \"type\": \"table\",\n   \"title\": \"Workload -> workload, measured at the caller (outbound)\",\n   \"description\": \"Independent of ServiceAccounts, so it works before per-service identities are rolled out.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 13,\n    \"w\": 12,\n    \"h\": 10\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (namespace, deployment, dst_namespace, dst_deployment) (rate(request_total{direction=\\\"outbound\\\",namespace=~\\\"$namespace\\\",dst_deployment!=\\\"\\\"}[$__range]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    }\n   ],\n   \"transformations\": [\n    {\n     \"id\": \"merge\"\n    },\n    {\n     \"id\": \"organize\",\n     \"options\": {\n      \"excludeByName\": {\n       \"Time\": true\n      },\n      \"renameByName\": {\n       \"Value #A\": \"Requests/s\",\n       \"namespace\": \"From ns\",\n       \"deployment\": \"From\",\n       \"dst_namespace\": \"To ns\",\n       \"dst_deployment\": \"To\"\n      }\n     }\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"sortBy\": [\n     {\n      \"displayName\": \"Requests/s\",\n      \"desc\": true\n     }\n    ]\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Requests/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"reqps\"\n       }\n      ]\n     }\n    ]\n   }\n  },\n  {\n   \"id\": 41,\n   \"type\": \"table\",\n   \"title\": \"Top destinations by authority (like linkerd viz top)\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 13,\n    \"w\": 12,\n    \"h\": 10\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"topk(25, sum by (deployment, authority) (rate(request_total{direction=\\\"outbound\\\",namespace=~\\\"$namespace\\\",authority!=\\\"\\\"}[$__range])))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    }\n   ],\n   \"transformations\": [\n    {\n     \"id\": \"merge\"\n    },\n    {\n     \"id\": \"organize\",\n     \"options\": {\n      \"excludeByName\": {\n       \"Time\": true\n      },\n      \"renameByName\": {\n       \"Value #A\": \"Requests/s\",\n       \"deployment\": \"From\",\n       \"authority\": \"Destination\"\n      }\n     }\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"sortBy\": [\n     {\n      \"displayName\": \"Requests/s\",\n      \"desc\": true\n     }\n    ]\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Requests/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"reqps\"\n       }\n      ]\n     }\n    ]\n   }\n  },\n  {\n   \"id\": 42,\n   \"type\": \"row\",\n   \"title\": \"External and unmeshed destinations\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 23,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 43,\n   \"type\": \"table\",\n   \"title\": \"Outbound connections to destinations outside the mesh\",\n   \"description\": \"Kafka, Redis, Aurora, the Kubernetes API and external APIs show up here. Useful to see what the egress surface looks like before any egress policy is considered.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 24,\n    \"w\": 24,\n    \"h\": 10\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (namespace, deployment, dst_service, dst_namespace, no_tls_reason) (rate(tcp_open_total{direction=\\\"outbound\\\",namespace=~\\\"$namespace\\\",tls!=\\\"true\\\"}[$__range]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"\
    table\"\n    }\n   ],\n   \"transformations\": [\n    {\n     \"id\": \"merge\"\n    },\n    {\n     \"id\": \"organize\",\n     \"options\": {\n      \"excludeByName\": {\n       \"Time\": true\n      },\n      \"renameByName\": {\n       \"Value #A\": \"Conns/s\",\n       \"namespace\": \"From ns\",\n       \"deployment\": \"From\",\n       \"dst_service\": \"Service\",\n       \"dst_namespace\": \"To ns\",\n       \"no_tls_reason\": \"Why not mTLS\"\n      }\n     }\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"sortBy\": [\n     {\n      \"displayName\": \"Conns/s\",\n      \"desc\": true\n     }\n    ]\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Conns/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"cps\"\n       }\n      ]\n     }\n    ]\n   }\n  }\n ],\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"datasource\",\n    \"label\": \"Data source\",\n    \"type\": \"datasource\",\n    \"query\": \"prometheus\",\n    \"regex\": \"/^VictoriaMetrics$/\",\n    \"hide\": 0,\n    \"refresh\": 1,\n    \"current\": {}\n   },\n   {\n    \"name\": \"namespace\",\n    \"label\": \"Namespace\",\n    \"type\": \"query\",\n    \"datasource\": {\n     \"type\": \"prometheus\",\n     \"uid\": \"${datasource}\"\n    },\n    \"refresh\": 2,\n    \"sort\": 1,\n    \"query\": {\n     \"query\": \"label_values(request_total, namespace)\",\n     \"refId\": \"v_namespace\"\n    },\n    \"multi\": true,\n    \"includeAll\": true,\n    \"allValue\": \".+\",\n    \"hide\": 0,\n    \"current\": {}\n   }\n  ]\n },\n \"annotations\": {\n  \"list\": []\n }\n}"

