apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-linkerd-security
  namespace: monitoring-ns
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Linkerd
data:
  linkerd-security.json: "{\n \"uid\": \"linkerd-security\",\n \"title\": \"Linkerd / Security & control plane\",\n \"description\": \"Encryption coverage, policy decisions, certificate health and the control plane. Replaces linkerd-viz health checks.\",\n \"tags\": [\n  \"linkerd\",\n  \"security\"\n ],\n \"timezone\": \"browser\",\n \"schemaVersion\": 39,\n \"version\": 1,\n \"editable\": true,\n \"refresh\": \"30s\",\n \"graphTooltip\": 1,\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"panels\": [\n  {\n   \"id\": 44,\n   \"type\": \"stat\",\n   \"title\": \"Identity issuer expires in\",\n   \"description\": \"cert-manager renews the 48 h issuer around the 25 h mark; the value should bounce between about 25 and 48 h.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 4,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"min((certmanager_certificate_expiration_timestamp_seconds{name=\\\"linkerd-identity-issuer\\\"} - time()) / 3600)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"h\",\n     \"noValue\": \"-\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 12\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 20\n       }\n      ]\n     }\n    }\n   }\n  },\n  {\n   \"id\": 45,\n   \"type\": \"stat\",\n   \"title\": \"Trust anchor expires in\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 4,\n    \"y\": 0,\n    \"w\": 4,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"min((certmanager_certificate_expiration_timestamp_seconds{name=\\\"linkerd-trust-anchor\\\"} - time()) / 86400)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"d\",\n     \"noValue\": \"-\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 90\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 365\n       }\n      ]\n     }\n    }\n   }\n  },\n  {\n   \"id\": 46,\n   \"type\": \"stat\",\n   \"title\": \"Control plane pods ready\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 0,\n    \"w\": 4,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum(kube_deployment_status_replicas_available{namespace=\\\"linkerd\\\"})\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"none\",\n     \"noValue\": \"-\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       }\n      ]\n     }\n    }\n   }\n  },\n  {\n   \"id\": 47,\n   \"type\": \"stat\",\n   \"title\": \"Pods without a proxy\",\n   \"description\": \"Pods in the production namespace with NO Linkerd proxy: they enforce no policy.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 4,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"count((kube_pod_status_phase{namespace=\\\"prod-app-ns\\\",phase=\\\"Running\\\"} == 1) unless on (namespace, pod) count by (namespace, pod) (kube_pod_container_info{container=\\\"linkerd-proxy\\\"} or kube_pod_init_container_info{container=\\\"linkerd-proxy\\\"})) or vector(0)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"none\",\n     \"noValue\": \"-\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 1\n       }\n      ]\n     }\n    }\n   }\n  },\n  {\n   \"id\": 48,\n   \"type\": \"stat\",\n   \"title\": \"mTLS requests / s\",\n   \"description\": \"Requests per second authenticated with a mesh identity (edge gateway and service-to-service). Health probes are not counted.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 16,\n    \"y\": 0,\n    \"w\": 4,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum(rate(request_total{direction=\\\"inbound\\\",tls=\\\"true\\\"}[$__rate_interval])) or vector(0)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\",\n     \"noValue\": \"-\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       }\n      ]\n     }\n    }\n   }\n  },\n  {\n   \"id\": 49,\n   \"type\": \"stat\",\n   \"title\": \"Denials / s\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 20,\n    \"y\": 0,\n    \"w\": 4,\n    \"h\": 4\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"(sum(rate(inbound_http_authz_deny_total[$__rate_interval])) + sum(rate(inbound_tcp_authz_deny_total[$__rate_interval]))) or vector(0)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\"\n    }\n   ],\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ]\n    },\n    \"colorMode\": \"background\",\n    \"graphMode\": \"none\"\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\",\n     \"noValue\": \"-\",\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 0.01\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 1\n       }\n      ]\n     }\n    }\n   }\n  },\n  {\n   \"id\": 50,\n   \"type\": \"row\",\n   \"title\": \"Encryption\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 4,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 51,\n   \"type\": \"timeseries\",\n   \"title\": \"mTLS requests/s by caller identity\",\n   \"description\": \"Who is calling over mTLS. The edge gateway appears here for public traffic; services appear for internal calls.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 5,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (client_id) (rate(request_total{direction=\\\"inbound\\\",tls=\\\"true\\\"}[$__rate_interval]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{client_id}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 52,\n   \"type\": \"table\",\n   \"title\": \"Inbound requests without a mesh identity (kubelet probes and any unmeshed client)\",\n   \"description\": \"Kubelet health probes come from the node and cannot carry an identity, so every workload with probes is listed (about 0.2 to 0.6 req/s per pod is normal). Investigate a workload whose rate is far higher: that is an unmeshed client.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\":\
    \ 5,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (namespace, deployment, tls) (rate(request_total{direction=\\\"inbound\\\",tls!=\\\"true\\\"}[$__range]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    }\n   ],\n   \"transformations\": [\n    {\n     \"id\": \"merge\"\n    },\n    {\n     \"id\": \"organize\",\n     \"options\": {\n      \"excludeByName\": {\n       \"Time\": true\n      },\n      \"renameByName\": {\n       \"Value #A\": \"Requests/s\",\n       \"namespace\": \"Namespace\",\n       \"deployment\": \"Workload\",\n       \"tls\": \"tls\"\n      }\n     }\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"sortBy\": [\n     {\n      \"displayName\": \"Requests/s\",\n      \"desc\": true\n     }\n    ]\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Requests/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"reqps\"\n       }\n      ]\n     }\n    ]\n   }\n  },\n  {\n   \"id\": 53,\n   \"type\": \"row\",\n   \"title\": \"Authorization policy (allow / deny)\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 13,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 54,\n   \"type\": \"timeseries\",\n   \"title\": \"Allowed vs denied (HTTP + TCP)\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 14,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum(rate(inbound_http_authz_allow_total[$__rate_interval])) + sum(rate(inbound_tcp_authz_allow_total[$__rate_interval]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"allowed\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum(rate(inbound_http_authz_deny_total[$__rate_interval])) + sum(rate(inbound_tcp_authz_deny_total[$__rate_interval]))\",\n     \"refId\": \"B\",\n     \"legendFormat\": \"denied\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 55,\n   \"type\": \"table\",\n   \"title\": \"Denials by workload and caller\",\n   \"description\": \"Every row is either an unexpected caller or a service missing from the policy. In audit mode these are the requests that WOULD be blocked.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 14,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"label_replace(label_replace(sum by (namespace, deployment, client_id, srv_name) (rate(inbound_http_authz_deny_total[$__range])), \\\"caller\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^([^.]+)\\\\\\\\..*\\\"), \\\"caller_ns\\\", \\\"$1\\\", \\\"client_id\\\", \\\"^[^.]+\\\\\\\\.([^.]+)\\\\\\\\..*\\\")\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"\",\n     \"instant\": true,\n     \"range\": false,\n     \"format\": \"table\"\n    }\n   ],\n   \"transformations\": [\n    {\n     \"id\": \"merge\"\n    },\n    {\n     \"id\": \"organize\",\n     \"options\": {\n      \"excludeByName\": {\n       \"Time\": true\n      },\n      \"renameByName\": {\n       \"Value #A\": \"Denied/s\",\n       \"namespace\": \"Namespace\",\n       \"deployment\": \"Workload\",\n       \"srv_name\": \"Server\",\n       \"caller\": \"Caller\",\n       \"caller_ns\": \"Caller ns\"\n      }\n     }\n    }\n   ],\n   \"options\": {\n    \"showHeader\": true,\n    \"sortBy\": [\n     {\n      \"displayName\": \"Denied/s\",\n      \"desc\": true\n     }\n    ]\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"align\": \"auto\"\n     }\n    },\n    \"overrides\": [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Denied/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"reqps\"\n       }\n      ]\n     }\n    ]\n   }\n  },\n  {\n   \"id\": 56,\n   \"type\": \"row\",\n   \"title\": \"Control plane\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 22,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 57,\n   \"type\": \"timeseries\",\n   \"title\": \"Control plane CPU\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 23,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"linkerd\\\",container!=\\\"\\\",container!=\\\"POD\\\"}[5m]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{pod}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"none\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 58,\n   \"type\": \"timeseries\",\n   \"title\": \"Control plane memory\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 23,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (pod) (container_memory_working_set_bytes{namespace=\\\"linkerd\\\",container!=\\\"\\\",container!=\\\"POD\\\"})\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{pod}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"bytes\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 59,\n   \"type\": \"timeseries\",\n   \"title\": \"Control plane restarts\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 16,\n    \"y\": 23,\n    \"w\": 8,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\\\"linkerd\\\"}[1h]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{pod}}/{{container}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"none\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 60,\n   \"type\": \"timeseries\",\n   \"title\": \"Certificate refreshes (proxies)\",\n   \"description\": \"Each meshed proxy renews its 24 h identity certificate before it expires.\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 30,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum(rate(control_identity_cert_refreshes_total[$__rate_interval]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"refreshes/s\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"ops\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\
    \n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 61,\n   \"type\": \"timeseries\",\n   \"title\": \"Identity certificate time left (proxies)\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 30,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"min by (namespace) ((control_identity_cert_expiration_timestamp_seconds - time()) / 3600)\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{namespace}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"h\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  }\n ],\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"datasource\",\n    \"label\": \"Data source\",\n    \"type\": \"datasource\",\n    \"query\": \"prometheus\",\n    \"regex\": \"/^VictoriaMetrics$/\",\n    \"hide\": 0,\n    \"refresh\": 1,\n    \"current\": {}\n   }\n  ]\n },\n \"annotations\": {\n  \"list\": []\n }\n}"
