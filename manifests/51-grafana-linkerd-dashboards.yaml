 [\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"Requests/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"reqps\"\n       }\n      ]\n     },\n     {\n      \"matcher\": {\n       \"id\": \"byName\",\n       \"options\": \"TCP conns/s\"\n      },\n      \"properties\": [\n       {\n        \"id\": \"unit\",\n        \"value\": \"cps\"\n       }\n      ]\n     }\n    ]\n   }\n  },\n  {\n   \"id\": 32,\n   \"type\": \"timeseries\",\n   \"title\": \"Outbound requests / s by callee\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 31,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (dst_deployment) (rate(request_total{direction=\\\"outbound\\\",namespace=\\\"$namespace\\\",deployment=\\\"$deployment\\\",dst_deployment!=\\\"\\\"}[$__rate_interval]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{dst_deployment}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 33,\n   \"type\": \"row\",\n   \"title\": \"Proxy resources\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 39,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 34,\n   \"type\": \"timeseries\",\n   \"title\": \"linkerd-proxy CPU (cores)\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 40,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"$namespace\\\",container=\\\"linkerd-proxy\\\",pod=~\\\"$deployment-.*\\\"}[$__rate_interval]))\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{pod}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"none\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 35,\n   \"type\": \"timeseries\",\n   \"title\": \"linkerd-proxy memory\",\n   \"description\": \"\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"${datasource}\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 40,\n    \"w\": 12,\n    \"h\": 7\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"${datasource}\"\n     },\n     \"expr\": \"sum by (pod) (container_memory_working_set_bytes{namespace=\\\"$namespace\\\",container=\\\"linkerd-proxy\\\",pod=~\\\"$deployment-.*\\\"})\",\n     \"refId\": \"A\",\n     \"legendFormat\": \"{{pod}}\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"bytes\",\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 0,\n      \"showPoints\": \"never\",\n      \"stacking\": {\n       \"mode\": \"none\"\n      }\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"table\",\n     \"placement\": \"bottom\",\n     \"calcs\": [\n      \"mean\",\n      \"max\"\n     ]\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\",\n     \"sort\": \"desc\"\n    }\n   }\n  },\n  {\n   \"id\": 36,\n   \"type\": \"row\",\n   \"title\": \"Live requests (replacement for linkerd viz tap)\",\n   \"collapsed\": false,\n   \"panels\": [],\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 47,\n    \"w\": 24,\n    \"h\": 1\n   }\n  },\n  {\n   \"id\": 37,\n   \"type\": \"logs\",\n   \"title\": \"Access log, newest first\",\n   \"datasource\": {\n    \"type\": \"victoriametrics-logs-datasource\",\n    \"uid\": \"VictoriaLogs\"\n   },\n   \"description\": \"Needs the namespace annotation config.linkerd.io/access-log=json (Phase 3) and Vector tagging log_type:mesh_access (60-vector-process-logs-linkerd.yaml). Unlike tap this is a stored log, searchable and RBAC-controlled through Grafana.\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 48,\n    \"w\": 24,\n    \"h\": 10\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"victoriametrics-logs-datasource\",\n      \"uid\": \"VictoriaLogs\"\n     },\n     \"refId\": \"A\",\n     \"expr\": \"log_type:mesh_access kubernetes.pod_namespace:\\\"$namespace\\\" workload:\\\"$deployment*\\\"\",\n     \"queryType\": \"instant\",\n     \"maxLines\": 200\n    }\n   ],\n   \"options\": {\n    \"showTime\": true,\n    \"wrapLogMessage\": true,\n    \"sortOrder\": \"Descending\",\n    \"enableLogDetails\": true\n   }\n  }\n ],\n \"templating\": {\n  \"list\": [\n   {\n    \"name\": \"datasource\",\n    \"label\": \"Data source\",\n    \"type\": \"datasource\",\n    \"query\": \"prometheus\",\n    \"regex\": \"/^VictoriaMetrics$/\",\n    \"hide\": 0,\n    \"refresh\": 1,\n    \"current\": {}\n   },\n   {\n    \"name\":