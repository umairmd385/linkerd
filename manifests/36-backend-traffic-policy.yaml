# Retries on the /users and /notification routes only: 3 attempts, 5 s per try, on gateway-error, connect-failure and
# refused-stream. (Retrying is only safe for requests that can be repeated; do not add it to routes that create orders or payments.)
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: backend-users-users-retry
  namespace: prod-app-ns
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: backend-users-users-retry
  retry:
    numRetries: 3
    perRetry:
      timeout: 5s
    retryOn:
      triggers:
      - gateway-error
      - connect-failure
      - refused-stream

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: backend-users-notification-retry
  namespace: prod-app-ns
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: backend-users-notification-retry
  retry:
    numRetries: 3
    perRetry:
      timeout: 5s
    retryOn:
      triggers:
      - gateway-error
      - connect-failure
      - refused-stream
