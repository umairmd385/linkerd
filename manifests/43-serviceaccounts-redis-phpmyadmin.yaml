# One identity each for the three workloads that were not built from the shared chart. automountServiceAccountToken is off:
# none of them calls the Kubernetes API; Linkerd uses its own projected identity token.
apiVersion: v1
kind: ServiceAccount
metadata: {name: prod-redis, namespace: prod-app-ns, labels: {app.kubernetes.io/managed-by: migrations-istio-to-linkerd}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prod-redis-insight, namespace: prod-app-ns, labels: {app.kubernetes.io/managed-by: migrations-istio-to-linkerd}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prod-phpmyadmin, namespace: prod-app-ns, labels: {app.kubernetes.io/managed-by: migrations-istio-to-linkerd}}
automountServiceAccountToken: false
